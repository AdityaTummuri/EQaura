[package]
name = "eqaura"
description = "System-wide equalizer"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
eq-core.workspace = true
eq-ai.workspace = true
eq-store.workspace = true
eq-backend.workspace = true
slint = { version = "1.19", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
cpal = "0.18"

[build-dependencies]
slint-build = "1.19"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
png = "0.18"
