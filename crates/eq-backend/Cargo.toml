[package]
name = "eq-backend"
description = "Connects EQaura to each system's audio engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
eq-core.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSString", "NSValue", "NSUUID"] }
objc2-core-foundation = { version = "0.3", features = ["CFDictionary", "CFString"] }
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
rtrb = "0.4"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
windows = { version = "0.62", features = [
    "Win32_Devices_FunctionDiscovery",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
] }
