<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="EQaura">
  <title>EQaura</title>
  <defs>
    <linearGradient id="tile" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#2A2823"/>
      <stop offset="1" stop-color="#121211"/>
    </linearGradient>
    <radialGradient id="aura" cx="512" cy="600" r="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F2994A" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#F2994A" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#F2994A" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="safe"><rect x="100" y="100" width="824" height="824" rx="190"/></clipPath>
  </defs>
  <!-- rounded square inside the safe area -->
  <rect x="100" y="100" width="824" height="824" rx="190" fill="url(#tile)"/>
  <g clip-path="url(#safe)">
    <rect x="100" y="100" width="824" height="824" fill="url(#aura)"/>
    <rect x="100.5" y="100.5" width="823" height="823" rx="189.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
  </g>
  <!-- the mark: an equalizer bell with two echoes above it -->
  <g transform="translate(100 100) scale(20.6)" fill="none" stroke="#F2994A" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2 8.5 C 10 8.5, 13 3.5, 20 3.5 C 27 3.5, 30 8.5, 38 8.5" stroke-opacity="0.27" stroke-width="1.6"/>
    <path d="M3 18 C 11 18, 14 9, 20 9 C 26 9, 29 18, 37 18" stroke-opacity="0.53" stroke-width="2"/>
    <path d="M4 29 C 11 29, 14 15, 20 15 C 26 15, 29 29, 36 29" stroke-opacity="1" stroke-width="3"/>
  </g>
</svg>
