[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]
exclude = ["fuzz", "apps/android"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
eq-core = { path = "crates/eq-core" }
eq-ai = { path = "crates/eq-ai" }
eq-store = { path = "crates/eq-store" }
eq-backend = { path = "crates/eq-backend" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
strip = true

# Sound and drawing stay tuned for speed.
[profile.release.package.eq-core]
opt-level = 3
[profile.release.package.eq-backend]
opt-level = 3
[profile.release.package.i-slint-core]
opt-level = 3
[profile.release.package.i-slint-renderer-software]
opt-level = 3

# Keep debug builds usable for real-time audio and drawing.
[profile.dev.package."*"]
opt-level = 1
debug = false
